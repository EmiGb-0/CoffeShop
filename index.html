<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffe Shop | Cliente</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <script src="src/js/data.js" defer></script>
    <script src="src/js/cliente.js" defer></script>
</head>
<body>

    <header class="barra">
        <h1>Coffe Shop</h1>
        <nav class="navegacion">
            <a href="index.html" class="activo">Cliente</a>
            <a href="caja.html">Caja</a>
            <a href="cocina.html">Cocina</a>
        </nav>
    </header>

    <main>
        <section id="promocion" class="promocion contenedor"></section>

        <section class="menu contenedor">
            <div id="filtros-menu">
                <button data-filtro="todos" class="activo">Todos</button>
                <button data-filtro="bebidas">Bebidas</button>
                <button data-filtro="postres">Postres</button>
                <button data-filtro="Precio mayor">Precio mayor</button>
                <button data-filtro="Precio menor">Precio menor</button>
            </div>
            <div>
                <h2>Menú</h2>
                <p>Explora nuestra gran variedad</p>
            </div>

            <div id="menu"></div>
        </section>

        <section class="pedidoc contenedor">
            <div>
                <h2>Haz tu pedido</h2>
                <p>Selecciona los artículos que deseas ordenar</p>

                <div class="pedido-formulario">
                    <label for="articulo">Artículo:</label>
                    <select name="articulo" id="articulo">
                        <option value="">Selecciona un artículo</option>
                    </select>
                    <button type="button" id="btn-agregar">Agregar al pedido</button>
                </div>

                <div class="resumen-pedido">
                    <h3>Artículos seleccionados:</h3>
                    <ul id="lista-pedido"></ul>
                    <button type="button" id="btn-ordenar">Realizar pedido</button>
                </div>

                <div class="estado-pedido">
                    <h3>Estado del pedido</h3>

                    <p id="estado-pedido">
                        Todavía no has realizado un pedido.
                    </p>

                    <button
                        type="button"
                        id="btn-cancelar"
                        style="display: none;"
                    >
                        Cancelar pedido
                    </button>
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
